<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>deer game</title>
  <link rel="icon" type="image/png" href="__ASSET_DIR__/ui/antlers.png" />
  <link rel="preload" as="font" type="font/ttf" href="__ASSET_DIR__/fonts/title.ttf" crossorigin />
  <style>
    @font-face { font-family: "deer"; src: url("__ASSET_DIR__/fonts/title.ttf") format("truetype"); font-display: swap; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #141a1c; }
    #deer-canvas { width: 100vw; height: 100vh; display: block; outline: none; }
    #loading { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; gap: 28px;
               align-items: center; justify-content: center; background: radial-gradient(#2a3330, #121718);
               color: #eddec2; font-family: "deer", monospace; user-select: none; transition: opacity .8s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .title { font-size: 96px; line-height: 1; text-shadow: 5px 5px 0 rgba(26, 13, 5, .85); }
    #loading .title span:nth-child(4n+1) { color: #9e542b; }
    #loading .title span:nth-child(4n+2) { color: #d99e66; }
    #loading .title span:nth-child(4n+3) { color: #6b3d24; }
    #loading .title span:nth-child(4n+4) { color: #eddec2; }
    #loading .bar { width: min(420px, 80vw); height: 14px; border: 3px solid #eddec2; position: relative; overflow: hidden; }
    #loading .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #d99e66; transition: width .15s; }
    #loading .bar.indeterminate .fill { width: 25%; animation: slide 1.1s ease-in-out infinite alternate; }
    @keyframes slide { from { left: 0; } to { left: 75%; } }
    #loading .message { font: 15px monospace; max-width: min(640px, 90vw); text-align: center; color: #e88a6a; user-select: text; }
    @media (max-width: 520px) { #loading .title { font-size: 56px; } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="title" id="loading-title"></div>
    <div class="bar indeterminate" id="loading-bar"><div class="fill" id="loading-fill"></div></div>
    <div class="message" id="loading-message"></div>
  </div>
  <canvas id="deer-canvas"></canvas>
  <script>
    // Browsers keep audio suspended until the page gets input; resume every AudioContext the
    // engine creates on the first click or key.
    (() => {
      const contexts = [];
      for (const name of ["AudioContext", "webkitAudioContext"]) {
        const Original = window[name];
        if (!Original) continue;
        const Patched = function (...args) { const ctx = new Original(...args); contexts.push(ctx); return ctx; };
        Patched.prototype = Original.prototype;
        window[name] = Patched;
      }
      const resume = () => {
        for (const ctx of contexts) if (ctx.state === "suspended") ctx.resume().catch(() => {});
      };
      for (const ev of ["pointerdown", "keydown", "touchstart"]) window.addEventListener(ev, resume, { capture: true, passive: true });
    })();

    // Pointer lock with raw mouse movement where supported (no OS acceleration).
    (() => {
      const proto = window.Element && Element.prototype;
      const original = proto && proto.requestPointerLock;
      if (!original) return;
      let unadjusted = true;
      const plain = (el) => { const r = original.call(el); if (r && r.catch) r.catch(() => {}); return r; };
      proto.requestPointerLock = function () {
        if (!unadjusted) return plain(this);
        let r;
        try { r = original.call(this, { unadjustedMovement: true }); } catch (e) { unadjusted = false; return plain(this); }
        if (r && r.catch) r.catch((e) => { if (e && e.name === "NotSupportedError") { unadjusted = false; plain(this); } });
        return r;
      };
    })();

    (() => {
      const el = (id) => document.getElementById(id);
      el("loading-title").innerHTML = [..."deer game"].map((c) => `<span>${c === " " ? "&nbsp;" : c}</span>`).join("");
      const root = el("loading"), bar = el("loading-bar"), fill = el("loading-fill"), message = el("loading-message");
      const CONTROL_FLOW = "Using exceptions for control flow";
      let finished = false, failed = false, shown = 0, creep = null;
      // Which build is running, and whether a failure to start may fall back to WebGL2.
      let backend = null, mayFallBack = false;
      // The Rust panic message (console_error_panic_hook logs it just before the wasm traps with
      // a bare "unreachable"), so a crash can say what actually went wrong.
      let lastPanic = null;
      const consoleError = console.error.bind(console);
      console.error = (...args) => {
        const m = args.map((a) => `${a}`).join(" ");
        if (m.includes("panicked at")) lastPanic = m;
        consoleError(...args);
      };
      const isCrash = (err, text) =>
        (typeof WebAssembly !== "undefined" && err instanceof WebAssembly.RuntimeError) ||
        /unreachable|RuntimeError|panicked at/.test(text);
      const progress = (fraction) => {
        if (finished || failed) return;
        bar.classList.remove("indeterminate");
        shown = Math.max(shown, Math.max(0, Math.min(1, fraction)));
        fill.style.width = `${shown * 100}%`;
      };
      // After the download the game still builds the forest, which reports no progress: the bar
      // keeps creeping towards the end (never back, never past it) until the game is ready.
      const creepOn = () => {
        if (creep) return;
        creep = setInterval(() => progress(shown + (0.97 - shown) * 0.04), 200);
      };
      const fail = (msg) => {
        if (failed) return;
        let text = `${msg}`;
        if (lastPanic && /unreachable|RuntimeError/.test(text)) text = lastPanic;
        // The WebGPU build did not get going in this browser: try the WebGL2 one instead.
        if (!finished && backend === "webgpu" && mayFallBack) {
          failed = true;
          consoleError(`deer game: the WebGPU build failed to start (${text}); reloading with WebGL2`);
          const params = new URLSearchParams(location.search);
          params.set("backend", "webgl2");
          location.replace(`${location.pathname}?${params}${location.hash}`);
          return;
        }
        failed = true;
        clearInterval(creep);
        bar.style.display = "none";
        message.textContent = (finished ? `the game crashed: ${text}` : text).slice(0, 600);
        if (finished) {
          // Already playing: bring the screen back to show what happened.
          root.style.display = "";
          root.classList.remove("done");
        }
        consoleError("deer game failed:", text);
      };
      // The wasm download fills most of the bar; the rest waits for the world to be built.
      const downloadWasm = async (url, expected) => {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${url}`);
        if (!res.body) return res;
        let received = 0;
        const reader = res.body.getReader();
        const body = new ReadableStream({
          async pull(controller) {
            const { done, value } = await reader.read();
            if (done) { progress(0.8); creepOn(); controller.close(); return; }
            received += value.byteLength;
            if (expected) progress(0.8 * Math.min(1, received / expected));
            controller.enqueue(value);
          },
          cancel(reason) { return reader.cancel(reason); },
        });
        return new Response(body, { status: 200, headers: { "Content-Type": "application/wasm" } });
      };
      // Called by the game (crates/client/src/web.rs) once the forest is in place.
      window.deerReady = () => {
        if (finished || failed) return;
        progress(1);
        finished = true;
        clearInterval(creep);
        root.classList.add("done");
        setTimeout(() => { if (!failed) root.style.display = "none"; }, 900);
      };
      const setBackend = (b, fallBack) => { backend = b; mayFallBack = fallBack; };
      window.deerLoading = { downloadWasm, fail, setBackend, CONTROL_FLOW };
      // Only the game itself crashing is fatal. Anything else (an audio context closing before
      // it resumed, a browser extension's script) is logged and otherwise ignored.
      window.addEventListener("error", (e) => {
        const m = `${e.message || e.error || e}`;
        if (m.includes(CONTROL_FLOW)) return;
        if (isCrash(e.error, m)) fail(m); else console.warn("deer game: ignored error:", m);
      });
      window.addEventListener("unhandledrejection", (e) => {
        const m = `${e.reason}`;
        if (m.includes(CONTROL_FLOW)) return;
        if (isCrash(e.reason, m)) fail(m); else console.warn("deer game: ignored rejection:", m);
      });
    })();
  </script>
  <script type="module">
    // Two builds ship (build-web.sh): deer-webgpu for browsers that hand out a WebGPU adapter,
    // and deer-webgl2 for the rest. Only the chosen one is downloaded. `?backend=webgl2|webgpu`
    // forces one; a forced choice never falls back.
    const { downloadWasm, fail, setBackend, CONTROL_FLOW } = window.deerLoading;
    const params = new URLSearchParams(location.search);
    const forced = params.get("backend");
    const WASM_BYTES = { webgpu: Number("__WASM_BYTES_WEBGPU__") || 0, webgl2: Number("__WASM_BYTES_WEBGL2__") || 0 };
    const pickBackend = async () => {
      if (forced === "webgl2" || forced === "webgpu") return [forced, "forced by ?backend="];
      if (!navigator.gpu) return ["webgl2", "navigator.gpu is missing"];
      try {
        const adapter = await navigator.gpu.requestAdapter();
        return adapter ? ["webgpu", "WebGPU adapter available"] : ["webgl2", "requestAdapter() returned null"];
      } catch (e) {
        return ["webgl2", `requestAdapter() failed: ${e}`];
      }
    };
    const hasWebGL2 = () => {
      try { return !!document.createElement("canvas").getContext("webgl2"); } catch (e) { return false; }
    };
    (async () => {
      const [backend, why] = await pickBackend();
      console.info(`deer game renderer: ${backend} (${why})`);
      if (backend === "webgl2" && !hasWebGL2()) {
        fail("this browser can't draw the game (no WebGPU or WebGL2). try turning on hardware acceleration in its settings, or a recent Chrome, Edge, Safari or Firefox.");
        return;
      }
      setBackend(backend, backend === "webgpu" && !forced);
      try {
        const { default: init } = await import(`./deer-${backend}.js?v=__CACHE_BUST__`);
        await init({ module_or_path: downloadWasm(new URL(`./deer-${backend}_bg.wasm?v=__CACHE_BUST__`, import.meta.url), WASM_BYTES[backend]) });
      } catch (e) {
        if (`${e}`.includes(CONTROL_FLOW)) return;
        fail(e);
        throw e;
      }
    })();
  </script>
</body>
</html>
