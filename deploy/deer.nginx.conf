# deer.fluffycat.gay on sarahvps. Installed once by hand (the deploy workflow does not touch nginx):
#
#   sudo cp deploy/deer.nginx.conf /etc/nginx/sites-enabled/deer.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d deer.fluffycat.gay      # adds the 443 server and the redirect
#
#   /                 the web build (build-web.sh -> /srv/deer/dist, published by the workflow)
#   /ws, /health      -> deer-server on 127.0.0.1:3560 (supervisor program deer-server)

map $http_upgrade $deer_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name deer.fluffycat.gay;
    root /srv/deer/dist;

    types {
        text/html            html;
        text/javascript      js;
        application/wasm     wasm;
        model/gltf-binary    glb;
        model/gltf+json      gltf;
        application/octet-stream bin;
        image/png            png;
        audio/ogg            ogg;
        font/ttf             ttf;
        text/plain           wesl;
    }
    default_type application/octet-stream;

    # precompressed deer-*.wasm.gz / .js.gz from build-web.sh
    gzip_static on;
    gzip on;
    gzip_types model/gltf+json application/octet-stream text/plain;

    location = /ws {
        proxy_pass http://127.0.0.1:3560;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $deer_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:3560;
    }

    # index.html changes in place; everything it points at is versioned or content-hashed
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    listen 80;
    listen [::]:80;
}
