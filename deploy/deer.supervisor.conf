; deer game server on sarahvps. Installed once:
;   sudo mkdir -p /srv/deer && sudo chown debian /srv/deer && cp .env.example /srv/deer/.env  (set DEER_HOST=127.0.0.1)
;   sudo cp deploy/deer.supervisor.conf /etc/supervisor/conf.d/deer.conf && sudo supervisorctl update
; The deploy workflow copies the binary to /srv/deer/deer-server and restarts this program;
; it reads /srv/deer/.env from its working directory.
[program:deer-server]
command=/srv/deer/deer-server
directory=/srv/deer
autostart=true
autorestart=true
user=debian
stdout_logfile=/var/log/supervisor/deer-server.log
stderr_logfile=/var/log/supervisor/deer-server-error.log
stopasgroup=true
