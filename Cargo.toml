[workspace]
resolver = "3"
members = ["crates/shared", "crates/client", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }

# Optimise dependencies even in debug builds; Bevy is unusably slow otherwise.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
debug = false
strip = true

[profile.wasm-dev]
inherits = "dev"
debug = false
strip = "debuginfo"
